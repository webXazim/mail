[package]
name = "harbor-api"
version = "0.1.0"
edition = "2021"
description = "Harbor Mail business backend - Axum container on the crescentsphere VPS"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
# Stalwart provisioning bridge (management JMAP over HTTP). rustls-only to keep
# the Debian runtime image free of OpenSSL build deps.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Blob/get returns attachment bytes as base64.
base64 = "0.22"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }

# Single binary that serves the whole business-mail API.
# Layered: api/ (handlers) -> services/ (IO) -> domain/ (pure logic).
