name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Ephemeral Postgres so WS8.5 integration tests run instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: harbor
          POSTGRES_DB: harbor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://harbor:harbor@localhost:5432/harbor_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pin matches backend/rust-toolchain.toml so CI == local == image.
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  # Informational only. `cargo audit` is red on arrival because of advisories
  # with no available fix (rsa / RUSTSEC-2023-0071) and a pending sqlx 0.7 -> 0.8
  # upgrade (RUSTSEC-2024-0363). Do not make this blocking until those land, or
  # every PR fails. See docs/LAUNCH.md.
  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        working-directory: backend
        run: |
          test -f Cargo.lock || cargo generate-lockfile
          cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
