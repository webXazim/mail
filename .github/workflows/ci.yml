name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Ephemeral Postgres so WS8.5 integration tests run instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: harbor
          POSTGRES_DB: harbor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://harbor:harbor@localhost:5432/harbor_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pin matches backend/rust-toolchain.toml so CI == local == image.
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  # Informational only. `cargo audit` is red on arrival because of advisories
  # with no available fix (rsa / RUSTSEC-2023-0071) and a pending sqlx 0.7 -> 0.8
  # upgrade (RUSTSEC-2024-0363). Do not make this blocking until those land, or
  # every PR fails. See docs/LAUNCH.md.
  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        working-directory: backend
        run: |
          test -f Cargo.lock || cargo generate-lockfile
          cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  # WS8.3: image scan (trivy) + SBOM. Blocks on critical-only findings;
  # ignore-unfixed so an OS CVE with no upstream patch isn't a hard gate.
  image:
    name: Backend image (trivy scan + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t harbor-api:ci ./backend
      - name: Scan image (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: harbor-api:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: harbor-api:ci
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy.sarif
            sbom.cdx.json

  # WS8.4: post-deploy smoke (health -> register -> login -> refresh -> use the
  # rotated token). Boots api + db only (no Stalwart needed) with verification
  # relaxed and the provisioning bridge off.
  smoke:
    name: Post-deploy smoke (health/register/login/refresh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot api + db
        env:
          HARBOR_JWT_SECRET: ci-only-secret-XXXXXXXXXXXXXXXXXXXXXXXXXX
          HARBOR_REQUIRE_VERIFICATION: 'false'
          HARBOR_MAIL_ADMIN_URL: ''
          HARBOR_CORS_ORIGINS: http://localhost:5174
        run: |
          docker compose up -d db
          docker compose up -d --no-deps api
      - name: Run smoke test
        shell: pwsh
        run: ./deploy/smoke-test.ps1 -BaseUrl http://127.0.0.1:8080
