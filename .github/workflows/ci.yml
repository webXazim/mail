name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Ephemeral Postgres so WS8.5 integration tests run instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: csmail
          POSTGRES_PASSWORD: csmail
          POSTGRES_DB: csmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://csmail:csmail@localhost:5432/csmail_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pin matches backend/rust-toolchain.toml so CI == local == image.
          toolchain: 1.88.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Tests
        run: cargo test --all-targets

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  # Blocking dependency audit. The only accepted RustSec exception lives in
  # backend/.cargo/audit.toml; all other advisories remain release-blocking.
  audit:
    name: Dependency audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        working-directory: backend
        run: |
          test -f Cargo.lock || cargo generate-lockfile
          cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  # WS8.3: image scan (trivy) + SBOM. Blocks on critical-only findings;
  # ignore-unfixed so an OS CVE with no upstream patch isn't a hard gate.
  image:
    name: Backend image (trivy scan + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cs-mail-api:ci ./backend
      - name: Scan image (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: cs-mail-api:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: cs-mail-api:ci
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy.sarif
            sbom.cdx.json

  # API + DB only; no Stalwart dependency. This uses the dedicated CI compose
  # so the repository root has no ambiguous production/development compose file.
  smoke:
    name: API smoke (health/register/login/refresh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot CI API + database
        run: docker compose -f deploy/development/ci-compose.yml up -d --build
      - name: Run smoke test
        run: ./deploy/production/smoke-test.sh http://127.0.0.1:8080
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/development/ci-compose.yml logs --tail=200

  release-layout:
    name: Production release layout/scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: find deploy/production -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Verify clean production release
        run: ./deploy/production/verify-release.sh

  launch-cert-static:
    name: Upgrade 37 release certification (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release contract/topology
        run: |
          python3 deploy/production/certify_launch.py \
            --static-only \
            --root "$PWD" \
            --report /tmp/cs-mail-launch-cert-static.json
      - uses: actions/upload-artifact@v4
        with:
          name: launch-cert-static
          path: /tmp/cs-mail-launch-cert-static.json

  # WS8.5 / LAUNCH L190: Monitoring gate — BLOCKING. Runs the exact promtool
  # (v2.54.1, the same tag compose deploys) against the alert-rule unit tests.
  # This is the memory-proof for "alerts firing": promtool.test.yml pins every
  # rule's real alertname/labels/gate, so a rule whose expr references a metric
  # the backend never exports (or an alertname that drifts from the rules file)
  # never fires -> the exp_alerts fail -> CI blocks. A silent, dead alert->
  # <->test pair cannot land. Header comment in prometheus.rules.test.yml is
  # the room's memory of this contract.
  monitoring:
    name: Monitoring (promtool test rules — blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate alert rules + unit tests (promtool)
        run: |
          docker run --rm --entrypoint promtool -w /rules \
            -v "$PWD/deploy/monitoring:/rules" \
            prom/prometheus:v2.54.1 test rules prometheus.rules.test.yml
