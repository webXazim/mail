global:
  scrape_interval: 15s
  evaluation_interval: 30s
  # external_labels:
  #   site: prod          # set by the deploy script from $DEPLOY_ENV; keeps
  #                       # per-environment series apart in a shared remote store.

rule_files:
  - prometheus.rules.yml

scrape_configs:
  # The only scrape target in the stack: the Harbor API, which is already
  # DB-aware and DB-gated (L189). Metrics are hand-rolled Prometheus text
  # format exported at /api/metrics (WS6.3) on the same port as the API.
  - job_name: harbor-api
    metrics_path: /api/metrics
    scheme: http
    static_configs:
      - targets: ['api:8080']
    # WS8.4 discipline: only the health gate lets a stray instance answer.
    # A single target here is correct until blue/green (WS1.6) lifts; the
    # swap re-reads this file through the deploy script, not at runtime.
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
