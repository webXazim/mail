# Development-only Alertmanager webhook fixture. Production renders
# alertmanager.production.yml into a private SMTP email configuration.
#
# Production routing is checked by the launch gate; alert rules and runbooks
# are checked separately by CI.
route:
  group_by: ['alertname']
  # Group a few minutes of related fires into one notification instead of
  # paging per-series; long enough to collate a burst, short enough to stay
  # fresh.
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # Deliver everything to a single receiver that records alerts in a local
  # queue + sends to the ops channel. All CS Mail alerts are ops-facing: DO NOT
  # send any of them straight to a user-facing endpoint.
  receiver: cs-mail-ops

receivers:
  - name: cs-mail-ops
    webhook_configs:
      # Never ship a localhost/dummy receiver in production. The
      # file is mounted read-only by deploy/production/docker-compose.yml and
      # contains exactly one HTTPS webhook URL. Alertmanager reads it as a
      # secret and does not expose the URL in its rendered configuration.
      - url_file: /run/secrets/cs_mail_alert_webhook_url
        send_resolved: true
        timeout: 10s

# No inhibit rules needed yet: the alert rules are deliberately independent
# (latency / 5xx / DB pool / SMTP delivery fire on their own series), so
# mutual suppression would hide real root causes.
