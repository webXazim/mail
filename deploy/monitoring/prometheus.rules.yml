# CS Mail alert rules — must reference the REAL metric names/labels exported by
# `/api/metrics` (see backend/src/metrics.rs). If an `expr` here drifts from a
# name or label the API actually emits, the rule is dead-on-arrival and the
# gate is silently unverified. Proven by `prometheus.rules.test.yml` via
# `promtool test rules` (a blocking CI job — L190).
groups:
  - name: cs_mail_availability
    rules:
      - alert: CSMailHigh5xxRate
        expr: |
          sum by (path) (
            rate(cs_mail_http_responses_5xx_total{path=~".+"}[5m])
          )
          / on (path)
          sum by (path) (
            rate(cs_mail_http_requests_total{path=~".+"}[5m])
          ) > 0.05
        for: 10m
        labels:
          severity: critical
          gate: l190
        annotations:
          summary: "5xx rate >5% on {{ $labels.path }}"
          description: "{{ $labels.path }} served 5xx at {{ $value | humanizePercentage }} of requests for 10m — check api logs, `docker compose logs api`."
          runbook: "deploy/monitoring/RUNBOOK.md#5xx"

      - alert: CSMailErrorBudgetBurning
        expr: |
          sum(rate(cs_mail_http_responses_5xx_total{path=~".+"}[1h]))
          / sum(rate(cs_mail_http_requests_total{path=~".+"}[1h]))
          > 0.02
        for: 30m
        labels:
          severity: warning
          gate: l190
        annotations:
          summary: "Error budget burning (2% 5xx over 1h)"
          description: "Cross-route 5xx share reached {{ $value | humanizePercentage }} over the last hour."

  - name: cs_mail_latency
    rules:
      - alert: CSMailSlowRoute
        # NOTE: no `sum by (le)` continuation is allowed here — any aggregation
        # that does not carry `le` forward destroys the histogram boundaries and
        # histogram_quantile silently returns nothing (a dead rule). With a
        # single api target, no grouping is needed; path rides through as a
        # label. Proven fireable by prometheus.rules.test.yml (L190-2).
        expr: |
          histogram_quantile(
            0.95,
            rate(cs_mail_http_request_duration_seconds_bucket{path=~".+"}[5m])
          ) > 2
        for: 10m
        labels:
          severity: warning
          gate: l190
        annotations:
          summary: "p95 latency >2s on {{ $labels.path }}"
          description: "{{ $labels.path }} p95 is {{ $value }}s — check SQLx pool pressure and Stalwart round trips."
          runbook: "deploy/monitoring/RUNBOOK.md#latency"

  - name: cs_mail_data
    rules:
      # Dead SQLx pool = do-not-deploy condition (WS6.5 gate also keys off /api/health).
      - alert: CSMailDbPoolExhausted
        expr: |
          cs_mail_db_pool_connections{state="idle"} == 0
        for: 5m
        labels:
          severity: critical
          gate: l190
        annotations:
          summary: "DB pool has zero idle connections"
          description: "All SQLx pool connections busy for 5m — lookup/inserts queuing; likely a leaking query or locked table."

      - alert: CSMailDbPoolGone
        expr: absent(cs_mail_db_pool_connections)
        for: 5m
        labels:
          severity: critical
          gate: l190
        annotations:
          summary: "DB pool metric absent"
          description: "`cs_mail_db_pool_connections` stopped appearing — api metrics endpoint unreachable or DB layer dead."

  - name: cs_mail_delivery
    rules:
      - alert: CSMailSmtpFailures
        expr: |
          sum by (result) (rate(cs_mail_smtp_sends_total{result="failed"}[15m]))
          > 0.02
        for: 10m
        labels:
          severity: warning
          gate: l190
        annotations:
          summary: "SMTP delivery failures climbing"
          description: "failed deliveries at {{ $value | humanize }} send/min — check `docker compose logs smtp` + Stalwart."

      - alert: CSMailSmtpRateLimited
        expr: |
          sum by (result) (rate(cs_mail_smtp_sends_total{result="rate_limited"}[15m]))
          > 0.02
        for: 15m
        labels:
          severity: warning
          gate: l190
        annotations:
          summary: "Mail rate-limited — send caps being hit"
          description: "{{ $labels.result }} at {{ $value | humanize }} /min — users near plan caps or warmup ramp."
          runbook: "deploy/monitoring/RUNBOOK.md#rate-limited"

      - alert: CSMailSmtpSuppressed
        expr: |
          sum by (result) (rate(cs_mail_smtp_sends_total{result="suppressed"}[15m]))
          > 0.005
        for: 15m
        labels:
          severity: warning
          gate: l190
        annotations:
          summary: "Mail suppressed (bounce/FBL)"
          description: "suppressed address drops at {{ $value | humanize }} /min — check suppression list + DSN ingests."

  - name: cs_mail_billing_lifecycle
    rules:
      - alert: CSMailBillingRecoveryFailure
        expr: cs_mail_billing_operational_issues{kind=~"provisioning_dead|lifecycle_email_failed|invoice_email_failed|purge_failed"} > 0
        for: 5m
        labels:
          severity: critical
          gate: launch
        annotations:
          summary: "Billing/provider recovery failure: {{ $labels.kind }}"
          description: "{{ $value }} durable {{ $labels.kind }} issue(s) require operator recovery before public launch or continued normal operation."
          runbook: "deploy/monitoring/RUNBOOK.md#billing-lifecycle"

      - alert: CSMailProviderReconciliationStale
        expr: cs_mail_billing_operational_issues{kind="provider_stale_mailboxes"} > 0
        for: 15m
        labels:
          severity: warning
          gate: launch
        annotations:
          summary: "Mailbox provider reconciliation is stale"
          description: "{{ $value }} mailbox(es) have not reconciled provider state within the expected 30-minute window."
          runbook: "deploy/monitoring/RUNBOOK.md#billing-lifecycle"

      - alert: CSMailPaymentReviewAging
        expr: cs_mail_billing_operational_issues{kind="payment_review_aging"} > 0
        for: 30m
        labels:
          severity: warning
          gate: launch
        annotations:
          summary: "Manual payment reviews are aging"
          description: "{{ $value }} submitted invoice(s) have waited more than 48 hours for operator review."
          runbook: "deploy/monitoring/RUNBOOK.md#billing-lifecycle"

  - name: cs_mail_recoverability
    rules:
      - alert: CSMailLocalBackupStale
        expr: |
          cs_mail_operational_evidence_age_seconds{kind="local_backup"} < 0
          or cs_mail_operational_evidence_age_seconds{kind="local_backup"} > 93600
        for: 5m
        labels:
          severity: critical
          gate: launch
        annotations:
          summary: "CS Mail local backup evidence is missing or stale"
          description: "Latest successful local database + attachment backup evidence is missing or older than 26 hours."
          runbook: "deploy/monitoring/RUNBOOK.md#recoverability"

      - alert: CSMailRestoreDrillStale
        expr: |
          cs_mail_operational_evidence_age_seconds{kind="restore_drill"} < 0
          or cs_mail_operational_evidence_age_seconds{kind="restore_drill"} > 604800
        for: 5m
        labels:
          severity: warning
          gate: launch
        annotations:
          summary: "CS Mail restore drill evidence is missing or stale"
          description: "No successful isolated restore drill has been recorded within seven days."
          runbook: "deploy/monitoring/RUNBOOK.md#recoverability"

      - alert: CSMailOffsiteBackupStale
        expr: |
          cs_mail_operational_evidence_age_seconds{kind=~"cs_mail_offsite_backup|stalwart_offsite_backup"} < 0
          or cs_mail_operational_evidence_age_seconds{kind=~"cs_mail_offsite_backup|stalwart_offsite_backup"} > 93600
        for: 5m
        labels:
          severity: critical
          gate: launch
        annotations:
          summary: "Offsite backup proof is missing or stale: {{ $labels.kind }}"
          description: "Offsite recoverability evidence for {{ $labels.kind }} is missing or older than 26 hours."
          runbook: "deploy/monitoring/RUNBOOK.md#recoverability"
