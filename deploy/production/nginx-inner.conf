map $http_upgrade $cs_mail_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /opt/cs-mail/www/current;
    index index.html;
    client_max_body_size 120m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob:; upgrade-insecure-requests" always;

    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }
    location = /mail/admin { return 404; }
    location ^~ /mail/admin/ { return 404; }
    location = /api/metrics { return 404; }

    location = /api/mail-imports {
        client_max_body_size 2100m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
        proxy_read_timeout 65s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /api/ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cs_mail_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
        proxy_read_timeout 65s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
    }
    location = /mail/config-v1.1.xml {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
    }

    location = /index.html { try_files $uri =404; add_header Cache-Control no-store always; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location / { try_files $uri $uri/ /index.html; }
}
