# Temporary HTTP-only vhost used only to obtain the first Let's Encrypt
# certificate. It coexists with other VPS sites and owns only this hostname.
server {
    listen 80;
    server_name mail.crescentsphere.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
