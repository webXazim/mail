# Host-level Nginx config for the CS Mail web application only.
# Do NOT proxy/bind 25, 465, 587 or 993 here. The existing shared Stalwart
# owns those host-wide protocol ports directly.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep cache policy at server scope so location blocks do not shadow the
# security add_header directives below. Empty values are not emitted.
map $uri $cs_mail_cache_control {
    default      "";
    /index.html  "no-store";
    ~^/assets/   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.crescentsphere.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.crescentsphere.com;

    ssl_certificate     /etc/letsencrypt/live/mail.crescentsphere.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.crescentsphere.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CSMAILTLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $cs_mail_cache_control always;
    # Outer SPA policy. HTML email is separately sandboxed with a
    # stricter per-message CSP in MailBodyFrame. Inline styles remain allowed
    # because a few React components use dynamic style attributes.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob:; upgrade-insecure-requests" always;

    # Normal API traffic never needs the MBOX migration ceiling. Keep a small
    # cushion above the backend's 100 MiB attachment hard limit.
    client_max_body_size 120m;

    root /opt/cs-mail/www/current;
    index index.html;

    location /api/ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }


    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
    }

    location = /mail/config-v1.1.xml {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
    }

    # The platform-control plane is intentionally NOT Internet
    # reachable. Operators use the localhost-only server below through SSH
    # port forwarding. Return 404 so the public edge does not disclose that the
    # admin surface exists.
    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }
    location = /mail/admin { return 404; }
    location ^~ /mail/admin/ { return 404; }

    # Prometheus scrapes this endpoint over the private Docker network. Never
    # expose internal counters to the public reverse proxy.
    location = /api/metrics {
        return 404;
    }

    # MBOX migration is the one endpoint allowed to accept a 2 GiB
    # streamed request. The API still enforces CS_MAIL_IMPORT_MAX_BYTES.
    location = /api/mail-imports {
        client_max_body_size 2100m;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Localhost-only platform administration endpoint.
# Access from an operator workstation with:
#   ssh -L 18081:127.0.0.1:18081 <user>@<vps>
# then browse to:
#   http://localhost:18081/mail/admin
#
# This socket never binds a public interface. The browser's Secure refresh
# cookie is deliberately downgraded only on this loopback HTTP endpoint; the
# SSH tunnel provides transport confidentiality between operator and VPS.
server {
    listen 127.0.0.1:18081;
    server_name localhost;

    client_max_body_size 120m;
    root /opt/cs-mail/www/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $cs_mail_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob:" always;

    # No public metrics even on the operator UI; Prometheus already has its
    # own dedicated loopback listener.
    location = /api/metrics { return 404; }

    location /api/ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-CS-Admin-Local "1";
        proxy_cookie_flags cs_mail_session nosecure;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-CS-Admin-Local "1";
        proxy_cookie_flags cs_mail_session nosecure;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /index.html { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
