# Include at http scope from Messenger's mounted snm.production.conf.
# This first stage serves only the Let's Encrypt HTTP challenge.
server {
    listen 80;
    listen [::]:80;
    server_name mail.crescentsphere.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 503; }
}
