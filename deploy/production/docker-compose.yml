name: cs-mail-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-csmail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: ${CS_MAIL_DB_MEMORY_LIMIT:-1g}
    cpus: ${CS_MAIL_DB_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csmail} -d ${POSTGRES_DB:-csmail}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    image: ${CS_MAIL_API_IMAGE:-cs-mail-api:production}
    build:
      context: ../../backend
      args:
        BUILD_SHA: ${CS_MAIL_BUILD_SHA:-unknown}
        BUILD_DATE: ${CS_MAIL_BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      CS_MAIL_LISTEN_ADDR: ${CS_MAIL_LISTEN_ADDR:-0.0.0.0:8080}
      CS_MAIL_PUBLIC_ORIGIN: ${CS_MAIL_PUBLIC_ORIGIN:?set CS_MAIL_PUBLIC_ORIGIN}
      CS_MAIL_CORS_ORIGINS: ${CS_MAIL_CORS_ORIGINS:?set CS_MAIL_CORS_ORIGINS}
      CS_MAIL_TRUSTED_PROXY_IPS: ${CS_MAIL_TRUSTED_PROXY_IPS:-172.29.40.1}
      CS_MAIL_LOG_FORMAT: json
      CS_MAIL_DATABASE_URL: postgres://${POSTGRES_USER:-csmail}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-csmail}
      CS_MAIL_DB_MAX_CONNECTIONS: ${CS_MAIL_DB_MAX_CONNECTIONS:-10}
      CS_MAIL_JWT_SECRET: ${CS_MAIL_JWT_SECRET:?set CS_MAIL_JWT_SECRET}
      CS_MAIL_JWT_ACCESS_TTL_SECS: ${CS_MAIL_JWT_ACCESS_TTL_SECS:-900}
      CS_MAIL_JWT_REFRESH_TTL_SECS: ${CS_MAIL_JWT_REFRESH_TTL_SECS:-2592000}
      CS_MAIL_DELIVERY_EVENT_SECRET: ${CS_MAIL_DELIVERY_EVENT_SECRET:?set CS_MAIL_DELIVERY_EVENT_SECRET}
      CS_MAIL_PROVISIONING_KEY: ${CS_MAIL_PROVISIONING_KEY:?set CS_MAIL_PROVISIONING_KEY}
      CS_MAIL_TOTP_KEY: ${CS_MAIL_TOTP_KEY:?set CS_MAIL_TOTP_KEY}
      CS_MAIL_COOKIE_SECURE: "true"
      CS_MAIL_REQUIRE_VERIFICATION: "true"
      CS_MAIL_DEV_RETURN_TOKEN_LINKS: "false"
      CS_MAIL_BILLING_INSTANT_ACTIVATION: ${CS_MAIL_BILLING_INSTANT_ACTIVATION:-false}
      # Shared Stalwart. This compose file intentionally has NO mail service and
      # binds none of 25/465/993. Those host-wide ports remain owned by the
      # existing provider used by the developer mailer project.
      CS_MAIL_MAIL_ADMIN_URL: ${CS_MAIL_MAIL_ADMIN_URL:?set shared Stalwart management URL}
      CS_MAIL_MAIL_ADMIN_USERNAME: ${CS_MAIL_MAIL_ADMIN_USERNAME:-admin}
      CS_MAIL_MAIL_ADMIN_SECRET: ${CS_MAIL_MAIL_ADMIN_SECRET:-}
      CS_MAIL_MAIL_ADMIN_TOKEN: ${CS_MAIL_MAIL_ADMIN_TOKEN:?set least-privilege Stalwart management token}
      CS_MAIL_MAIL_JMAP_USERNAME: ${CS_MAIL_MAIL_JMAP_USERNAME:?set Stalwart JMAP service principal}
      CS_MAIL_MAIL_JMAP_SECRET: ${CS_MAIL_MAIL_JMAP_SECRET:?set Stalwart JMAP service secret}
      CS_MAIL_MAIL_DEFAULT_DOMAIN: ${CS_MAIL_MAIL_DEFAULT_DOMAIN:-crescentsphere.com}
      CS_MAIL_PROVIDER_NAMESPACE: ${CS_MAIL_PROVIDER_NAMESPACE:-cs-mail}
      CS_MAIL_MAIL_REQUEST_TIMEOUT_SECS: ${CS_MAIL_MAIL_REQUEST_TIMEOUT_SECS:-10}
      CS_MAIL_MAIL_READ_RETRIES: ${CS_MAIL_MAIL_READ_RETRIES:-2}
      CS_MAIL_MAIL_RETRY_BASE_MS: ${CS_MAIL_MAIL_RETRY_BASE_MS:-150}
      # API-to-provider relay stays on the private shared-provider Docker network.
      # It is separate from customer app-password submission on public :465.
      CS_MAIL_SMTP_HOST: ${CS_MAIL_SMTP_HOST:?set shared Stalwart service hostname}
      CS_MAIL_SMTP_PORT: ${CS_MAIL_SMTP_PORT:-25}
      CS_MAIL_SMTP_USERNAME: ${CS_MAIL_SMTP_USERNAME:-}
      CS_MAIL_SMTP_PASSWORD: ${CS_MAIL_SMTP_PASSWORD:-}
      CS_MAIL_SMTP_TIMEOUT_SECS: ${CS_MAIL_SMTP_TIMEOUT_SECS:-30}
      CS_MAIL_CLIENT_HOST: ${CS_MAIL_CLIENT_HOST:-smtp.crescentsphere.com}
      CS_MAIL_CLIENT_IMAP_PORT: ${CS_MAIL_CLIENT_IMAP_PORT:-993}
      CS_MAIL_CLIENT_SMTP_PORT: ${CS_MAIL_CLIENT_SMTP_PORT:-465}
      CS_MAIL_CLIENT_MAX_APP_PASSWORDS: ${CS_MAIL_CLIENT_MAX_APP_PASSWORDS:-5}
      CS_MAIL_IMPORT_MAX_BYTES: ${CS_MAIL_IMPORT_MAX_BYTES:-2147483648}
      CS_MAIL_IMPORT_MESSAGE_MAX_BYTES: ${CS_MAIL_IMPORT_MESSAGE_MAX_BYTES:-52428800}
      CS_MAIL_IMPORT_POLL_SECS: ${CS_MAIL_IMPORT_POLL_SECS:-5}
      CS_MAIL_IMPORT_LEASE_SECS: ${CS_MAIL_IMPORT_LEASE_SECS:-900}
      CS_MAIL_REALTIME_POLL_SECS: ${CS_MAIL_REALTIME_POLL_SECS:-2}
      CS_MAIL_REALTIME_LEASE_SECS: ${CS_MAIL_REALTIME_LEASE_SECS:-60}
      CS_MAIL_REALTIME_BATCH_SIZE: ${CS_MAIL_REALTIME_BATCH_SIZE:-20}
      CS_MAIL_REALTIME_EVENT_RETENTION_SECS: ${CS_MAIL_REALTIME_EVENT_RETENTION_SECS:-604800}
      CS_MAIL_PROVISIONING_POLL_SECS: ${CS_MAIL_PROVISIONING_POLL_SECS:-2}
      CS_MAIL_PROVISIONING_LEASE_SECS: ${CS_MAIL_PROVISIONING_LEASE_SECS:-120}
      CS_MAIL_PROVISIONING_RETRY_BASE_SECS: ${CS_MAIL_PROVISIONING_RETRY_BASE_SECS:-5}
      CS_MAIL_PROVISIONING_RECONCILE_SECS: ${CS_MAIL_PROVISIONING_RECONCILE_SECS:-300}
      CS_MAIL_PROVISIONING_MAX_ATTEMPTS: ${CS_MAIL_PROVISIONING_MAX_ATTEMPTS:-12}
      CS_MAIL_PROVISIONING_BATCH_SIZE: ${CS_MAIL_PROVISIONING_BATCH_SIZE:-10}
      CS_MAIL_SCHEDULE_POLL_SECS: ${CS_MAIL_SCHEDULE_POLL_SECS:-5}
      CS_MAIL_SCHEDULE_LEASE_SECS: ${CS_MAIL_SCHEDULE_LEASE_SECS:-300}
      CS_MAIL_SCHEDULE_RETRY_BASE_SECS: ${CS_MAIL_SCHEDULE_RETRY_BASE_SECS:-15}
      CS_MAIL_SCHEDULE_MAX_ATTEMPTS: ${CS_MAIL_SCHEDULE_MAX_ATTEMPTS:-12}
      CS_MAIL_SCHEDULE_BATCH_SIZE: ${CS_MAIL_SCHEDULE_BATCH_SIZE:-20}
      CS_MAIL_ATTACHMENT_STORE_DIR: ${CS_MAIL_ATTACHMENT_STORE_DIR:-/srv/attachments}
      CS_MAIL_ATTACHMENT_STAGING_QUOTA_BYTES: ${CS_MAIL_ATTACHMENT_STAGING_QUOTA_BYTES:-1073741824}
      CS_MAIL_ATTACHMENT_UPLOAD_TTL_SECS: ${CS_MAIL_ATTACHMENT_UPLOAD_TTL_SECS:-86400}
      CS_MAIL_ATTACHMENT_DRAFT_TTL_SECS: ${CS_MAIL_ATTACHMENT_DRAFT_TTL_SECS:-2592000}
      CS_MAIL_ATTACHMENT_CONSUMED_GRACE_SECS: ${CS_MAIL_ATTACHMENT_CONSUMED_GRACE_SECS:-3600}
      CS_MAIL_ATTACHMENT_CLEANUP_SECS: ${CS_MAIL_ATTACHMENT_CLEANUP_SECS:-900}
    ports:
      - "127.0.0.1:${CS_MAIL_API_HOST_PORT:-18080}:8080"
    volumes:
      - api-attachments:/srv/attachments
    networks:
      - backend
      - shared_mail
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: ${CS_MAIL_API_MEMORY_LIMIT:-1g}
    cpus: ${CS_MAIL_API_CPU_LIMIT:-1.0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: nginx:1.30.4-alpine
    user: "101:101"
    restart: unless-stopped
    profiles: ["shared_proxy"]
    volumes:
      - ./nginx-inner.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/cs-mail/www:/opt/cs-mail/www:ro
    networks:
      backend:
        ipv4_address: 172.29.40.10
      shared_web:
        aliases: [cs-mail-web]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=700
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=700
    mem_limit: 128m
    cpus: "0.25"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  web_admin:
    image: nginx:1.30.4-alpine
    user: "101:101"
    restart: unless-stopped
    profiles: ["shared_proxy"]
    volumes:
      - ./nginx-admin-inner.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/cs-mail/www:/opt/cs-mail/www:ro
    ports:
      - "127.0.0.1:${CS_MAIL_ADMIN_HOST_PORT:-18081}:8081"
    networks:
      backend:
        ipv4_address: 172.29.40.11
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=700
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=700
    mem_limit: 128m
    cpus: "0.25"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 384m
    cpus: "0.35"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${CS_MAIL_ALERT_WEBHOOK_FILE:-/opt/cs-mail/secrets/alert-webhook-url}:/run/secrets/cs_mail_alert_webhook_url:ro
    ports:
      - "127.0.0.1:19093:9093"
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 192m
    cpus: "0.20"

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: ${CS_MAIL_BACKEND_SUBNET:-172.29.40.0/24}
          gateway: ${CS_MAIL_BACKEND_GATEWAY:-172.29.40.1}
  shared_mail:
    external: true
    name: ${CS_MAIL_SHARED_PROVIDER_NETWORK:?set the existing Stalwart Docker network name}
  shared_web:
    external: true
    name: ${CS_MAIL_SHARED_WEB_NETWORK:-cs-platform-web}

volumes:
  pgdata:
  api-attachments:
