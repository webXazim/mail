global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    timeout connect 5s
    timeout client 300s
    timeout server 300s

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend public_http
    bind :80
    mode http
    acl cs_mail hdr(host) -m reg -i ^mail\.crescentsphere\.com(:[0-9]+)?$
    use_backend mail_http if cs_mail
    default_backend messenger_http

backend mail_http
    mode http
    server mail_tls 172.29.41.11:8080 check

backend messenger_http
    mode http
    server messenger cs-messenger-nginx-1:80 check resolvers docker init-addr none

# Preserve Messenger's existing TLS termination and Cloudflare Origin CA cert.
# Only CS Mail's SNI is routed to its own publicly trusted certificate.
frontend public_https
    bind :443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl cs_mail req.ssl_sni -i mail.crescentsphere.com
    use_backend mail_https if cs_mail
    default_backend messenger_https

backend mail_https
    mode tcp
    server mail_tls 172.29.41.11:8443 send-proxy-v2 check

backend messenger_https
    mode tcp
    server messenger cs-messenger-nginx-1:443 check resolvers docker init-addr none
