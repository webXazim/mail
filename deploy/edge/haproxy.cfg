global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    timeout connect 5s
    timeout client 300s
    timeout server 300s

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend public_http
    bind :80
    mode http
    acl cs_mail hdr(host) -m reg -i ^mail\.crescentsphere\.com(:[0-9]+)?$
    acl cs_connect hdr(host) -m reg -i ^connect\.crescentsphere\.com(:[0-9]+)?$
    acl cs_widget hdr(host) -m reg -i ^widget\.crescentsphere\.com(:[0-9]+)?$
    http-request deny deny_status 403 unless cs_mail or cs_connect or cs_widget
    use_backend mail_http if cs_mail
    default_backend messenger_http

backend mail_http
    mode http
    server mail_tls 172.29.41.11:8080 check

backend messenger_http
    mode http
    server messenger cs-connect-nginx-1:80 check resolvers docker init-addr none

# Pass connect/widget TLS through to Messenger's Cloudflare Origin CA certificate.
# CS Mail keeps its separate publicly trusted certificate; unknown SNI is rejected.
frontend public_https
    bind :443
    mode tcp
    tcp-request inspect-delay 5s
    acl cs_mail req.ssl_sni -i mail.crescentsphere.com
    acl cs_connect req.ssl_sni -i connect.crescentsphere.com
    acl cs_widget req.ssl_sni -i widget.crescentsphere.com
    tcp-request content reject if { req.ssl_hello_type 1 } !cs_mail !cs_connect !cs_widget
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend mail_https if cs_mail
    default_backend messenger_https

backend mail_https
    mode tcp
    server mail_tls 172.29.41.11:8443 send-proxy-v2 check

backend messenger_https
    mode tcp
    server messenger cs-connect-nginx-1:443 check resolvers docker init-addr none
