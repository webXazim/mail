map $http_upgrade $cs_mail_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name mail.crescentsphere.com;
    location = /healthz { access_log off; return 200 'ok'; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://mail.crescentsphere.com$request_uri; }
}

server {
    listen 8443 ssl proxy_protocol;
    server_name mail.crescentsphere.com;
    if ($host != mail.crescentsphere.com) { return 421; }
    set_real_ip_from 172.29.41.10;
    real_ip_header proxy_protocol;
    ssl_certificate /etc/letsencrypt/live/mail.crescentsphere.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.crescentsphere.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }
    location = /mail/admin { return 404; }
    location ^~ /mail/admin/ { return 404; }
    location = /api/metrics { return 404; }

    location / {
        client_max_body_size 2100m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cs_mail_upstream cs-mail-web;
        proxy_pass http://$cs_mail_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CS-Admin-Local "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cs_mail_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
